services:

  angular-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: scheduler1-app
    container_name: scheduler1-app
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
