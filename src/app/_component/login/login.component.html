<div class="login-page">
    <div class="login-card card-panel">
        <h4 class="card-panel-title panel-banner">
            <span class="glyphicon glyphicon-lock"></span> ETL &mdash; Sign In
        </h4>

        <form *ngIf="loginForm" [formGroup]="loginForm" (ngSubmit)="submit()">
            <div class="form-group" [ngClass]="{ 'has-error': submitted && f.username.errors }">
                <label class="control-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" formControlName="username"
                    placeholder="Enter username" autocomplete="username" />
                <div *ngIf="submitted && f.username.errors" class="text-danger">Username is required</div>
            </div>

            <div class="form-group" [ngClass]="{ 'has-error': submitted && f.password.errors }">
                <label class="control-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" formControlName="password"
                    placeholder="Enter password" autocomplete="current-password" />
                <div *ngIf="submitted && f.password.errors" class="text-danger">Password is required</div>
            </div>

            <div *ngIf="error" class="text-danger" style="margin-bottom: 12px;">{{error}}</div>

            <button type="submit" class="btn btn-teal btn-block">
                <span class="glyphicon glyphicon-log-in"></span> Login
            </button>

            <span class="help-text" style="text-align: center; margin-top: 14px;">
                <span class="glyphicon glyphicon-info-sign"></span>
                Use <strong>admin&#64;platform.local</strong> / <strong>admin&#64;platform.local</strong> to sign in (change the password after).
            </span>
        </form>
    </div>
</div>
