<!-- new lookupData -->
<div class="modal fade" id="lookupDatas" role="dialog">
    <div class="modal-dialog modal-lg">
      <!-- Modal content-->
      <div class="modal-content" style="border: none">
        <form *ngIf="lookupDataForm" [formGroup]="lookupDataForm" (ngSubmit)="submitLookupData()">
            <div class="modal-header">
                <button type="button" class="close" #closeLookupData data-dismiss="modal"
                    (click)="resetEvent(4)">&times;
                </button>
                <h4 class="modal-title">{{LOOKUP_DATA_TITLE}}</h4>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="lookupType">LookupType</label>
                    <input type="text" formControlName="lookupType" class="form-control input-sm"
                        [ngClass]="{ 'is-invalid': lookupData.lookupType.errors }" />
                    <div *ngIf="submitted && lookupData.lookupType.errors" class="invalid-feedback">
                        <div *ngIf="lookupData.lookupType.errors.required" style="color: red;">
                            LookupType is required
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="lookupValue">LookupValue</label>
                        <!-- Lookup values here range from a one-word flag to a multi-line JSON/XML config
                             or a file path -- the browser's ~2-row textarea default left almost no room
                             to see what you were typing, so this gets real height + a resize handle. -->
                        <textarea formControlName="lookupValue" class="form-control input-sm lookup-value-textarea"
                        rows="6"
                        [ngClass]="{ 'is-invalid': lookupData.lookupValue.errors }"
                        [placeholder]="lookupData.encrypted.value ? 'Leave blank to keep the existing encrypted value' : ''"></textarea>
                    <div *ngIf="submitted && lookupData.lookupValue.errors" class="invalid-feedback">
                        <div *ngIf="lookupData.lookupValue.errors.required" style="color: red;">
                            LookupValue is required
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="checkbox">
                        <label>
                            <input type="checkbox" formControlName="encrypted" /> Encrypt this value
                        </label>
                    </div>
                    <small class="help-block" *ngIf="lookupData.encrypted.value">
                        Stored encrypted (AES-256-GCM). Its value is never shown again once saved — leave
                        LookupValue blank to keep it unchanged, or enter a new value to replace it.
                    </small>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" formControlName="description" class="form-control input-sm"
                        [ngClass]="{ 'is-invalid': lookupData.description.errors }" />
                    <div *ngIf="submitted && lookupData.description.errors" class="invalid-feedback" style="color: red;">
                        <div *ngIf="lookupData.description.errors.required">
                            Description is required
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="reset" class="btn btn-default" data-dismiss="modal"
                    (click)="resetEvent(4)">Close</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
      </div>
    </div>
</div>
