<!-- Breadcrumb -->
<nav class="breadcrumb-bar">
    <a routerLink="/home">Home</a>
    <span class="crumb-sep">/</span>
    <a href="javascript:void(0)" (click)="backClicked()">List</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Batch Action</span>
</nav>

<!-- Upload / Download / Template -->
<input type="file" accept="application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    style="display: none;" #inputUpload (change)="uploadBulk($event.target.files[0])" hidden>

<div class="toolbar" style="justify-content: flex-end;">
    <button type="button" class="btn btn-sm btn-teal" (click)="inputUpload.click()">
        <span class="glyphicon glyphicon-upload"></span> Upload {{buttonMessage}}
    </button>
    <button type="button" class="btn btn-sm btn-default" (click)="downloadList()">
        <span class="glyphicon glyphicon-download"></span> Download {{buttonMessage}}
    </button>
    <button type="button" class="btn btn-sm btn-default" (click)="downloadSourceTemplate()">
        <span class="glyphicon glyphicon-cog"></span> Template
    </button>
</div>

<!-- Results / Errors -->
<div class="card-panel">
    <h4 class="card-panel-title">Results</h4>
    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover table-modern">
            <thead>
                <tr>
                    <th>No#</th>
                    <th>Error</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let error of errors; let i = index">
                    <td>{{i+1}}</td>
                    <td><div class="cell-message" [innerHTML]="error"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
