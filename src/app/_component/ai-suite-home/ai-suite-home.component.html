<!-- breadcrumb -->
<nav class="breadcrumb-bar">
    <a routerLink="/home">Home</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">AI Suite</span>
</nav>

<div class="panel-box" style="background: #fff; border: 1px solid #e2e2e2; border-radius: 6px; padding: 16px; margin-bottom: 16px;">
    <h4 style="margin-top: 0;"><span class="glyphicon glyphicon-flash"></span> AI Suite</h4>
    <span class="help-text" style="display: block;">
        <span class="glyphicon glyphicon-info-sign"></span>
        Every AI-powered tool in one place -- pick a card to open it, or use the AI Suite dropdown
        in the top nav for quicker access once you know where you're going.
    </span>
</div>

<div class="tool-card-grid">
    <a href="javascript:void(0);" class="tool-card" *ngFor="let tool of tools" (click)="open(tool)">
        <span class="tool-card-icon"><span class="glyphicon" [ngClass]="tool.icon"></span></span>
        <span class="tool-card-title">{{ tool.title }}</span>
        <span class="tool-card-description">{{ tool.description }}</span>
        <span class="tool-card-open">Open <span class="glyphicon glyphicon-chevron-right"></span></span>
    </a>
</div>
