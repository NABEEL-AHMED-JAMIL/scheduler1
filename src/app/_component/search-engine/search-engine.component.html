<nav class="breadcrumb-bar">
    <a routerLink="/home">Home</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">Q-Result</span>
</nav>

<form *ngIf="tableQueryForm" [formGroup]="tableQueryForm" (ngSubmit)="dynamicQueryResponse()">
    <div class="card-panel">
        <h4 class="card-panel-title panel-banner">
            <span class="glyphicon glyphicon-search"></span> Search Engine
        </h4>

        <div class="form-group" style="margin-bottom: 14px;">
            <label class="control-label" for="query">SQL Query</label>
            <textarea id="query" class="form-control code-input" rows="12"
                formControlName="query"
                placeholder="Enter a SELECT query to run, e.g.  SELECT * FROM source_job LIMIT 100"
                required></textarea>
            <span class="help-text">
                <span class="glyphicon glyphicon-info-sign"></span>
                Only SELECT statements are supported.
            </span>
        </div>

        <div class="toolbar" style="margin-bottom: 0;">
            <span class="toolbar-spacer"></span>
            <button type="reset" class="btn btn-sm btn-default" (click)="tableQueryFormInit()">
                <span class="glyphicon glyphicon-erase"></span> Clear
            </button>
            <button type="submit" class="btn btn-sm btn-teal" [disabled]="tableQueryForm.invalid">
                <span class="glyphicon glyphicon-play"></span> Run Query
            </button>
        </div>
    </div>
</form>

<div class="card-panel" *ngIf="jsonPayload">
    <div class="toolbar">
        <div class="form-group" style="margin-bottom: 0;">
            <input type="text" id="searchDetails" class="form-control input-sm" style="width: 280px;"
                placeholder="Search" [(ngModel)]="searchDetails"/>
        </div>
        <span class="toolbar-spacer"></span>
        <label class="control-label" style="margin-bottom: 0;">
            Query Result ({{ (jsonPayload.data || []).length }})
        </label>
    </div>

    <div class="table-responsive scroll-table">
        <table class="table table-striped table-bordered table-hover table-modern table-strong"
            style="font-size: 12px; white-space: nowrap;">
            <thead>
                <tr>
                    <th *ngFor="let key of jsonPayload.column">{{key | uppercase}}</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="(jsonPayload.data | searchFilter: searchDetails) as rows">
                <tr *ngFor="let item of rows; let i = index;">
                    <td *ngFor="let key of jsonPayload.column">
                        <ng-container *ngIf="(item[key] === null || item[key] === undefined ? '' : item[key].toString()).length > 60; else plainCell">
                            <div class="cell-message">{{item[key]}}</div>
                        </ng-container>
                        <ng-template #plainCell>{{item[key]}}</ng-template>
                    </td>
                </tr>
                <tr *ngIf="!rows.length">
                    <td [attr.colspan]="jsonPayload.column.length" class="table-empty-cell">
                        <span class="glyphicon glyphicon-search"></span>
                        No rows match "{{searchDetails}}".
                    </td>
                </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>
