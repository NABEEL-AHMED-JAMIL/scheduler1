<!-- breadcrumb -->
<nav class="breadcrumb-bar">
    <a routerLink="/home">Home</a>
    <span class="crumb-sep">/</span>
    <a routerLink="/jobList">Job List</a>
    <span class="crumb-sep">/</span>
    <span class="crumb-current">{{currentTaskState}}</span>
</nav>

<form *ngIf="sourceJobForm" [formGroup]="sourceJobForm" (ngSubmit)="onSubmit()">
    <div class="card-panel">
        <h3 class="card-panel-title">{{currentTaskState}}</h3>

        <!-- Main Job Details Grid -->
        <div class="row">
            <!-- Job Name -->
            <div class="form-group col-md-3">
                <label for="jobName" class="control-label">JobName</label>
                <input type="text" class="form-control"
                    id="jobName"
                    formControlName="jobName"
                    [ngClass]="{ 'has-error': submitted && sourceJob.jobName.errors }" />
                <div *ngIf="submitted && sourceJob.jobName.errors" class="text-danger">
                    <div *ngIf="sourceJob.jobName.errors.required">JobName is required</div>
                </div>
            </div>

            <!-- Execution Type -->
            <div class="form-group col-md-3">
                <label for="executionType" class="control-label">ExecutionType</label>
                <select class="form-control"
                    id="executionType"
                    formControlName="executionType"
                    (change)="onExecutionTypeChange($event.target.value)"
                    [ngClass]="{ 'has-error': submitted && sourceJob.executionType.errors }">
                    <option hidden value="" disabled selected>Select ExecutionType</option>
                    <option *ngFor="let executionType of executionTypes" [value]="executionType">
                        {{executionType}}
                    </option>
                </select>
                <div *ngIf="submitted && sourceJob.executionType.errors" class="text-danger">
                    <div *ngIf="sourceJob.executionType.errors.required">ExecutionType is required</div>
                </div>
            </div>

            <!-- Source Task -->
            <div class="form-group col-md-3" formGroupName="taskDetail">
                <label for="taskDetailId" class="control-label">Source Task</label>
                <select class="form-control"
                    id="taskDetailId"
                    formControlName="taskDetailId"
                    (change)="onTaskDetailChange($event.target.value)"
                    [ngClass]="{ 'has-error': submitted && taskDetail.taskDetailId.errors }">
                    <option hidden value="" disabled selected>Select Source Task</option>
                    <option *ngFor="let sourceTask of sourceTasks" [value]="sourceTask.taskDetailId">
                        {{sourceTask.taskDetailId}} ({{sourceTask.taskName}})
                    </option>
                </select>
                <div *ngIf="submitted && taskDetail.taskDetailId.errors" class="text-danger">
                    <div *ngIf="taskDetail.taskDetailId.errors.required">Source Task is required</div>
                </div>
            </div>

            <!-- Priority -->
            <div class="form-group col-md-3">
                <label for="priority" class="control-label">Priority</label>
                <select class="form-control"
                    id="priority"
                    formControlName="priority"
                    [ngClass]="{ 'has-error': submitted && sourceJob.priority.errors }">
                    <option hidden value="" disabled selected>Select Priority</option>
                    <option *ngFor="let priority of prioritys" [value]="priority">{{priority}}</option>
                </select>
                <div *ngIf="submitted && sourceJob.priority.errors" class="text-danger">
                    <div *ngIf="sourceJob.priority.errors.required">Priority is required</div>
                </div>
            </div>
        </div>

        <!-- Scheduler Section -->
        <div *ngIf="sourceJobForm.get('scheduler')" formGroupName="scheduler" class="form-section">
            <h4 class="card-panel-title">Schedule Configuration</h4>
            <div class="row">
                <div class="form-group col-md-3">
                    <label for="startDate" class="control-label">Start Date</label>
                    <input type="date" class="form-control"
                        id="startDate"
                        formControlName="startDate"
                        [ngClass]="{ 'has-error': submitted && scheduler.startDate?.errors }"/>
                    <div *ngIf="submitted && scheduler.startDate?.errors" class="text-danger">
                        <div *ngIf="scheduler.startDate?.errors.required">Required*</div>
                    </div>
                </div>
                <div class="form-group col-md-3">
                    <label for="endDate" class="control-label">End Date</label>
                    <input type="date" class="form-control"
                        id="endDate"
                        formControlName="endDate"
                        [ngClass]="{ 'has-error': submitted && scheduler.endDate?.errors }"/>
                    <div *ngIf="submitted && scheduler.endDate?.errors" class="text-danger">
                        <div *ngIf="scheduler.endDate?.errors.required">Required*</div>
                    </div>
                </div>
                <div class="form-group col-md-2">
                    <label for="startTime" class="control-label">Time</label>
                    <select class="form-control"
                        id="startTime"
                        formControlName="startTime"
                        [ngClass]="{ 'has-error': submitted && scheduler.startTime?.errors }">
                        <option hidden value="" disabled selected>Time</option>
                        <option *ngFor="let startTime of times" [value]="startTime">{{startTime}}</option>
                    </select>
                    <div *ngIf="submitted && scheduler.startTime?.errors" class="text-danger">
                        <div *ngIf="scheduler.startTime?.errors.required">Required*</div>
                    </div>
                </div>
                <div class="form-group col-md-2">
                    <label for="frequency" class="control-label">Frequency</label>
                    <select class="form-control"
                        id="frequency"
                        formControlName="frequency"
                        (change)="onFrequencyChange($event.target.value)"
                        [ngClass]="{ 'has-error': submitted && scheduler.frequency?.errors }">
                        <option hidden value="" disabled selected>Frequency</option>
                        <option *ngFor="let frequency of frequencys" [value]="frequency">
                            {{frequency}}
                        </option>
                    </select>
                    <div *ngIf="submitted && scheduler.frequency?.errors" class="text-danger">
                        <div *ngIf="scheduler.frequency?.errors.required">Required*</div>
                    </div>
                </div>
                <div class="form-group col-md-2">
                    <label for="recurrence" class="control-label">Recurrence</label>
                    <select class="form-control"
                        id="recurrence"
                        formControlName="recurrence"
                        [ngClass]="{ 'has-error': submitted && scheduler.recurrence?.errors }">
                        <option hidden value="" disabled selected>Recurrence</option>
                        <option *ngFor="let recurrence of recurrences" [value]="recurrence">
                            {{recurrence}}
                        </option>
                    </select>
                    <div *ngIf="submitted && scheduler.recurrence?.errors" class="text-danger">
                        <div *ngIf="scheduler.recurrence?.errors.required">Required*</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Details Section -->
        <div *ngIf="selectedSourceTask" class="form-section">
            <h4 class="card-panel-title">Task Details</h4>
            <div class="row" formGroupName="taskDetail">
                <div class="form-group col-md-3">
                    <label for="serviceName" class="control-label">ServiceName</label>
                    <input type="text" class="form-control"
                        id="serviceName"
                        formControlName="serviceName"
                        disabled />
                </div>
                <div class="form-group col-md-3">
                    <label for="queueTopicPartition" class="control-label">QueueTopicPartition</label>
                    <input type="text" class="form-control"
                        id="queueTopicPartition"
                        formControlName="queueTopicPartition"
                        disabled />
                </div>
                <div class="form-group col-md-3">
                    <label for="homePageId" class="control-label">HomePage</label>
                    <input type="text" class="form-control"
                        id="homePageId"
                        formControlName="homePageId"
                        placeholder="Enter HomePage Url"
                        disabled />
                </div>
                <div class="form-group col-md-3" *ngIf="isEditMode">
                    <label for="jobStatus" class="control-label">JobStatus</label>
                    <select class="form-control"
                        id="jobStatus"
                        formControlName="jobStatus">
                        <option *ngFor="let jobStatus of sourceJobStatus" [value]="jobStatus.value">{{jobStatus.key}}</option>
                    </select>
                </div>
            </div>
            <div class="form-group" formGroupName="taskDetail">
                <label for="taskPayload" class="control-label">JobPayload</label>
                <textarea class="form-control"
                    id="taskPayload"
                    formControlName="taskPayload"
                    rows="5"
                    placeholder="Enter the task configuration detail"
                    disabled></textarea>
            </div>
            <div class="toolbar">
                <span class="toolbar-spacer"></span>
                <label class="checkbox-inline">
                    <input type="checkbox" formControlName="completeJob" id="completeJob" />
                    Email job complete
                </label>
                <label class="checkbox-inline">
                    <input type="checkbox" formControlName="failJob" id="failJob" />
                    Email job fail
                </label>
                <label class="checkbox-inline">
                    <input type="checkbox" formControlName="skipJob" id="skipJob" />
                    Email job skip
                </label>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="toolbar" style="margin-bottom: 0;">
            <span class="toolbar-spacer"></span>
            <button type="reset" class="btn btn-sm btn-default"
                (click)="addSourceJobFormInit()">
                <span class="glyphicon glyphicon-erase"></span> Clear
            </button>
            <button type="submit" class="btn btn-sm btn-teal">
                <span class="glyphicon glyphicon-ok"></span> Save
            </button>
        </div>
    </div>
</form>
<br><br>
