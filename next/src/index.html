<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ETL Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG first so the tab shows the app's own mark and stays crisp at any density; the .ico
       remains for browsers that ignore SVG icons. -->
  <!-- Versioned because browsers cache a favicon far more stubbornly than any other asset:
       the file changed and the tab kept drawing the old one until the URL changed with it.
       Bump v when the mark changes. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="favicon.svg?v=2">
  <meta name="theme-color" content="#030712">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Compass's own two faces. Inter is requested on its variable axis (100..900) rather
       than four fixed cuts: Compass sets weights like 550 that a fixed-cut file cannot
       render, and one variable file is smaller than the four it replaces. Geist Mono is
       the mono face Compass pairs with it. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Geist+Mono:wght@400;500;600&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
