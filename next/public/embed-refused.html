<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>View not available</title>
  <style>
    :root { color-scheme: light dark; --page: #f9fafb; --card: #ffffff; --text: #101828; --muted: #4a5565; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) { :root { --page: #030712; --card: #101828; --text: #f9fafb; --muted: #99a1af; --line: #1e2939; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 28rem; margin: 16px; padding: 2rem; text-align: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 0.625rem; }
    h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>This view is not available</h1>
    <p>The link is not valid, has expired, or may not be shown here. Ask the site you came from for a new one.</p>
  </main>
</body>
</html>
