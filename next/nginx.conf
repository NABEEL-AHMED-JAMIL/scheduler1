# MIG-335: the embeddable run view's token, from /embed/runs/{token}: a view link's shape (ViewLinks.SHAPE in Core) or
# nothing. Only this reaches the frame check below; anything else is refused without asking.
map $request_uri $embed_token {
    "~^/embed/runs/(?<token>[A-Za-z0-9_-]{8,512}\.[A-Za-z0-9_-]{43})(?:\?[^#]*)?$" $token;
    default "";
}

server {
    listen 80;
    server_name _;

    # No version in the Server header or on error pages (MIG-323).
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The browser's own guards, on every response. The microphone is the console's own (self): dictation in File chat and
    # the Job assistant uses the browser's speech recognition, which microphone=() switched off (MIG-323 review). nginx's add_header does not inherit into a
    # location that adds headers of its own, so the same four are repeated where Cache-Control is
    # set. No Content-Security-Policy yet: Angular's inline styles and the pdf.js worker need a
    # policy tried end to end first; HSTS belongs on whatever terminates TLS in front of this.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Every JS/CSS chunk from the esbuild builder carries a content hash in its filename
    # (main-FZLOWSZF.js), so a new build is always a new URL -- caching these forever is safe
    # and a stale browser can never serve one under an old name.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
        access_log off;
    }

    # index.html is the one file whose content changes without its name changing -- it is what
    # points the browser at this build's hashed chunks, so it must never be served stale.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
    }

    # Stock nginx mime.types maps .js but not the newer .mjs extension (pdfjs-dist's worker file,
    # copied in via angular.json's asset config -- see pdf-viewer.ts). Unmatched, nginx falls
    # back to application/octet-stream, and a browser strict about module-script MIME types
    # refuses to run it as the worker pdf.js needs. default_type, not a `types {}` block: nginx's
    # own mime.types file is itself a complete `types { ... }` block meant for inclusion at the
    # http level, not for nesting inside another one -- default_type overrides the type nginx
    # falls back to for a request it has no mapping for, without touching that table at all.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # MIG-335: one run's read-only view, for a customer's portal to frame (/embed/runs/{token}). The one page of the console
    # that may be framed, and only by the origins its API client's allow-list names: before serving it, nginx asks the
    # customer API's signed frame check (GET /v1/embed/runs/{token}/frame, through the gateway) and answers
    # Content-Security-Policy frame-ancestors with what it says ('none' when the list is empty). A token the check does not
    # know, or a check that cannot be made, gets the refusal page, which nobody may frame. No cookies are set or read here;
    # the token in the address is kept out of Referer.
    location ^~ /embed/ {
        auth_request /_embed/frame;
        auth_request_set $embed_ancestors $upstream_http_embed_frame_ancestors;
        error_page 401 403 404 500 502 503 504 =404 /embed-refused.html;
        add_header Content-Security-Policy "frame-ancestors $embed_ancestors" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=()" always;
        try_files /index.html =404;
    }

    # The frame check, asked by the location above only. The gateway's alias on the platform network (compose: next-app is
    # on it); Docker's resolver, so nginx starts while the gateway is down and asks again later. Nothing of the visitor's
    # request goes with it: no body, no cookie, no authorization.
    location = /_embed/frame {
        internal;
        if ($embed_token = "") {
            return 403;
        }
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://gateway:9098/v1/embed/runs/$embed_token/frame;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # The check's 404 (not a link of ours) and 410 are a refusal here, not an error.
        proxy_intercept_errors on;
        error_page 404 410 = @embed_refused;
    }

    location @embed_refused {
        return 403;
    }

    # What a refused view answers: a plain sentence that no site may frame.
    location = /embed-refused.html {
        internal;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # provideRouter with no withHashLocation() means path-based routing (/admin/users,
    # /jobs/:jobId/edit, ...) -- a deep-link reload or a browser back/forward has to reach
    # index.html for the router to take over, or nginx 404s on a path that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
